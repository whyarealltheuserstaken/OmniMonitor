[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "omnimonitor"
version = "0.3.1"
description = "Local-first tray app that monitors AI usage, limits and spend across Grok, Claude, ChatGPT/Codex, Gemini, DeepSeek, Qwen, Kimi, Cursor, Copilot and more. No cookies, no scraping. Unofficial; not affiliated with any provider."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "OmniMonitor contributors" }]
keywords = ["ai-usage", "token-usage", "llm", "usage-monitor", "tray", "menubar", "grok", "claude-code", "codex", "gemini", "deepseek", "qwen", "kimi", "cursor", "copilot"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: MacOS",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Environment :: MacOS X",
  "Environment :: Win32 (MS Windows)",
  "Environment :: X11 Applications",
  "Topic :: Utilities",
]
dependencies = [
  "pystray>=0.19",
  "Pillow>=9.1",
  "certifi>=2023.7.22",
  # native app window; uses the system WebView (WKWebView / WebView2)
  "pywebview>=5; sys_platform == 'darwin' or sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.4"]
# Linux app window: needs a GUI backend; or use the system python3-gi + WebKit2GTK packages
window-qt = ["pywebview[qt]>=5"]
window-gtk = ["pywebview[gtk]>=5"]

[project.scripts]
omnimonitor = "omnimonitor.cli:main"

[project.gui-scripts]
omnimonitor-gui = "omnimonitor.cli:main"

[project.urls]
Homepage = "https://github.com/whyarealltheuserstaken/OmniMonitor"
Issues = "https://github.com/whyarealltheuserstaken/OmniMonitor/issues"
Changelog = "https://github.com/whyarealltheuserstaken/OmniMonitor/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
omnimonitor = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py39"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "B", "I"]
ignore = ["B008", "B904", "E501"]  # B904: we deliberately re-raise as user-facing UsageError
