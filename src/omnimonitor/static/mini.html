<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>OmniMonitor · mini</title>
<style>
  :root { --bg:#0d0d0d; --card:#161616; --line:#262626; --fg:#ececec; --mut:#8b8b8b;
          --g0:#1d1d1d; --g1:#0e3a5c; --g2:#14609a; --g3:#2a8bd8; --g4:#6cc0ff;
          --ok:#3fb950; --warn:#d29922; --bad:#f85149; --accent:#2a8bd8; --chip:#1d1d1d;
          --chipon:#333; }
  body.light { --bg:#f6f7f9; --card:#ffffff; --line:#e3e5e8; --fg:#16181b; --mut:#626a73;
               --g0:#eceef1; --chip:#eceef1; --chipon:#d4d8de; }
  body.light .banner.demo { background:#fff4d6; color:#6b4e00; border-color:#f0d58a; }
  body.light .banner.err { background:#ffe6e4; color:#8a1f17; border-color:#f3b1ab; }
  body.light .est { color:#9a6b00; }
  body.light a { color:#0a62b0; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--fg);
         font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Ubuntu,sans-serif; }
  main { max-width:980px; margin:0 auto; padding:28px 24px 48px; }
  h1 { font-size:22px; margin:0 0 4px; font-weight:600; }
  h1 .h1sub { font-weight:400; color:var(--mut); }
  h2 { font-size:15px; margin:0 0 12px; font-weight:600; }
  .sub { color:var(--mut); font-size:13px; }
  .banner { margin:14px 0 0; padding:10px 14px; border-radius:10px; font-size:13px; }
  .banner.demo { background:#3a2a00; color:#ffd57a; border:1px solid #6b4e00; }
  .banner.err { background:#3a1010; color:#ffb4ae; border:1px solid #6b2020; }
  .hero { display:grid; grid-template-columns:1.2fr 1fr; gap:16px; margin:22px 0; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:18px; }
  .big { font-size:40px; font-weight:650; letter-spacing:-0.02em; }
  .bar { height:10px; border-radius:6px; background:var(--line); overflow:hidden; margin:10px 0 6px; }
  .bar > i { display:block; height:100%; border-radius:6px; }
  .stats { display:grid; grid-template-columns:repeat(5,1fr); gap:0; margin:8px 0 26px;
           border-top:1px solid var(--line); border-bottom:1px solid var(--line); }
  .stat { padding:16px 14px; border-right:1px solid var(--line); }
  .stat:last-child { border-right:none; }
  .stat .v { font-size:22px; font-weight:600; }
  .stat .k { color:var(--mut); font-size:12.5px; margin-top:2px; }
  .na { color:var(--mut); font-weight:500; font-size:16px; border-bottom:1px dotted var(--mut);
        cursor:help; }
  .est { color:#ffd57a; }
  .tabs { float:right; display:flex; gap:4px; background:var(--chip); border-radius:9px; padding:3px; }
  .tabs button { background:none; border:0; color:var(--mut); padding:4px 10px; border-radius:7px;
                 cursor:pointer; font:inherit; font-size:12.5px; }
  .tabs button.on { background:var(--chipon); color:var(--fg); }
  .top { display:flex; justify-content:space-between; align-items:flex-start; gap:12px; }
  nav.links { display:flex; gap:6px; flex-wrap:wrap; justify-content:flex-end; }
  nav.links a { text-decoration:none; color:var(--fg); background:var(--chip); padding:5px 11px;
                border-radius:8px; font-size:12.5px; border:1px solid var(--line); }
  nav.links a:hover { border-color:var(--accent); }
  .grid3 { display:grid; grid-template-columns:repeat(3,1fr); gap:18px; }
  .grid4 { display:grid; grid-template-columns:repeat(4,1fr); gap:14px; }
  .mini-k { color:var(--mut); font-size:12px; }
  .mini-v { font-size:19px; font-weight:600; margin-top:2px; }
  .brow { padding:7px 0; border-bottom:1px solid var(--line); font-size:13px; }
  .brow:last-child { border-bottom:none; }
  .brow .t { display:flex; justify-content:space-between; gap:8px; }
  .brow .t .n { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .brow .t .m { color:var(--mut); white-space:nowrap; }
  .brow .meter { height:4px; background:var(--line); border-radius:3px; margin-top:5px; overflow:hidden; }
  .brow .meter > i { display:block; height:100%; background:var(--accent); border-radius:3px; }
  .brow .d { color:var(--mut); font-size:11.5px; margin-top:3px; }
  h3 { font-size:12.5px; color:var(--mut); font-weight:600; margin:0 0 4px; text-transform:uppercase;
       letter-spacing:.04em; }
  .pill { display:inline-block; padding:1px 8px; border-radius:20px; font-size:12px; font-weight:600; }
  .pill.ok { background:rgba(63,185,80,.18); color:var(--ok); }
  .pill.warn { background:rgba(210,153,34,.18); color:var(--warn); }
  .pill.bad { background:rgba(248,81,73,.18); color:var(--bad); }
  .heat { display:grid; grid-auto-flow:column; grid-template-rows:repeat(7,12px); gap:3px;
          overflow-x:auto; padding:4px 0 2px; }
  .heat i { width:12px; height:12px; border-radius:3px; background:var(--g0); display:block; }
  .months { display:grid; grid-auto-flow:column; gap:3px; color:var(--mut); font-size:11px;
            margin-bottom:4px; }
  .months span { width:12px; white-space:nowrap; overflow:visible; }
  .legend { display:flex; gap:3px; align-items:center; justify-content:flex-end; color:var(--mut);
            font-size:11px; margin-top:8px; }
  .legend i { width:11px; height:11px; border-radius:3px; display:inline-block; }
  .row { display:flex; justify-content:space-between; padding:11px 0; border-bottom:1px solid var(--line); }
  .row:last-child { border-bottom:none; }
  .row .l { color:var(--fg); } .row .r { color:var(--mut); }
  .section { margin-top:26px; }
  footer { margin-top:30px; color:var(--mut); font-size:12px; }
  a { color:#7cc4ff; }
  @media (max-width:760px) { .hero, .grid3 { grid-template-columns:1fr; }
    .grid4 { grid-template-columns:repeat(2,1fr); }
    .stats { grid-template-columns:repeat(2,1fr); } }

  main { max-width:420px; padding:14px 14px 18px; }
  .mrow { display:flex; justify-content:space-between; align-items:baseline; gap:10px; padding:7px 0;
          border-bottom:1px solid var(--line); font-size:13px; }
  .mrow:last-child { border-bottom:none; }
  .mrow .k { color:var(--mut); white-space:pre; } .mrow .v { font-weight:600; text-align:right; }
  .big { font-size:44px; }
</style>
<link rel="icon" href="data:,">
</head>
<body>
<main>
  <div class="top"><div class="sub" id="who">OmniMonitor</div><nav class="links"><a href="./" data-view="full" title="Back to the full OmniMonitor window">Full window</a></nav></div>
  <div id="banners"></div>
  <div class="card" style="margin-top:10px">
    <div class="sub">Weekly pool remaining</div>
    <div class="big" id="remaining">–</div>
    <div class="bar"><i id="barfill" style="width:0"></i></div>
    <div class="sub" id="reset"></div>
  </div>
  <div class="card" style="margin-top:10px" id="rows"></div>
  <div class="sub" style="margin-top:8px" id="upd"></div>
</main>
<script src="common.js"></script>
<script src="mini.js"></script>
</body>
</html>
