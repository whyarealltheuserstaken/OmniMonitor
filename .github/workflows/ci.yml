name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "ruff>=0.4"
      - run: ruff check src tests scripts

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.9", "3.12", "3.13"]
        exclude:
          # ubuntu-latest (26.04) has no prebuilt Python 3.9; test 3.9 on 24.04 instead
          - os: ubuntu-latest
            python: "3.9"
        include:
          - os: ubuntu-24.04
            python: "3.9"
    runs-on: ${{ matrix.os }}
    env:
      PYSTRAY_BACKEND: dummy   # no GUI on CI runners
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - run: pytest -q
      - name: CLI smoke test
        shell: bash
        run: |
          omnimonitor --version
          omnimonitor status --demo
          omnimonitor providers
          # No Grok CLI login on CI runners, so doctor must report a failed check (exit 1),
          # but it must not crash (any other exit code fails the job).
          rc=0; omnimonitor doctor --offline || rc=$?
          test "$rc" -eq 1

  window-smoke:
    # Native app window (pywebview) on real GUI runners: open the demo dashboard in its own
    # process, verify the page loaded via JS, close. Linux has no WebView backend by default.
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .
      - name: window --smoke
        shell: bash
        env:
          OMNIMONITOR_HOME: ${{ runner.temp }}/omni-home
        run: |
          omnimonitor window --smoke & WP=$!
          for i in $(seq 1 90); do kill -0 $WP 2>/dev/null || break; sleep 1; done
          if kill -0 $WP 2>/dev/null; then kill $WP; echo "timed out"; exit 1; fi
          wait $WP
